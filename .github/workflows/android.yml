name: Android debug build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — this repo's package.json pins
      # `"packageManager": "pnpm@9.15.0"`, and pnpm/action-setup@v4 auto-detects that. Passing an
      # explicit version too (even one that looks equivalent, like "9.15") makes it error with
      # "Multiple versions of pnpm specified" if the strings don't match exactly.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `packages:` override is required — this action's own default is `"tools platform-tools"`,
      # and Google has since removed the legacy `tools` package from the SDK repository manifest
      # entirely. Left at the default, `sdkmanager tools` fails with "Warning: Failed to find
      # package 'tools'" and the action treats that as fatal (confirmed live: exactly this build
      # failing at that step). `platforms;android-36`/`build-tools;36.0.0`/`ndk;...` are installed
      # explicitly in the next step regardless, so this only needs to keep `platform-tools`.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # Pinned to match apps/desktop/src-tauri/gen/android/app/build.gradle.kts's compileSdk/
      # targetSdk (36) and this project's NDK version, both verified locally — bump deliberately,
      # not by letting `sdkmanager` pick "latest".
      - name: Install Android SDK platform, build tools, and NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Generate the Android Studio project
        working-directory: apps/desktop
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm tauri android init

      # `tauri android init` seeds gen/android with the template's placeholder launcher icons;
      # regenerate them (and the adaptive-icon background colour) from the committed Perch source
      # so the APK ships the real brand icon. gen/android is gitignored, so this must run in CI.
      - name: Apply app icons
        working-directory: apps/desktop
        run: pnpm tauri icon src-tauri/app-icon.json --ios-color "#7D35EB"

      - name: Build debug APK
        working-directory: apps/desktop
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm tauri android build --debug --target aarch64

      - name: Locate APK
        id: apk
        run: |
          path=$(find apps/desktop/src-tauri/gen/android -name "*.apk" -path "*debug*" | head -1)
          echo "Found: $path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: perch-android-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
